[package]
name = "renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# The installed name. The crate stays `renderer`, which is what `-p renderer` and every module
# path in the tree already say; this is only what lands in `$PREFIX/lib/mantle`.
[[bin]]
name = "mantle-renderer"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# cosmic-text is reached only from `text/shaping.rs` and `text/fonts.rs`, for shaping and
# measurement; its default features drag in a rasterizer nothing here calls. 157 to 151. No
# `fontconfig` either: fonts resolve through `fc-match` (`text/fonts.rs`), not fontconfig's XML.
cosmic-text = { version = "0.19.0", default-features = false, features = ["std"] }
# `swash` is what makes the text look hinted. Without the feature femtovg falls back to
# `render_glyph`: it tessellates the `ttf-parser` outline and supersamples it 8x on the GPU, which
# runs no hinting bytecode and throws the subpixel position away, so every stem lands as two
# half-lit columns instead of one lit one. The feature swaps in `render_glyph_swash`, which scales
# through skrifa with hinting on -- `HintingMode::Smooth`, the same slight hinting fontconfig hands
# every other app here -- and rasterizes on the CPU at the real subpixel offset. Measured on this
# machine's bar clock at 11px: whole-lit pixels 4.4% to 6.3% of the box for the same ink.
#
# Three crates, and only in this crate's tree: swash, zeno, yazi. skrifa, read-fonts and font-types
# arrive with cosmic-text too, at 0.40 where swash takes 0.44, until cosmic-text moves up.
#
# No defaults: `textlayout` is femtovg's own shaper (cosmic-text shapes here) and `image-loading`
# is `load_image_file` (`image` decodes here).
femtovg = { version = "0.27.0", default-features = false, features = ["swash"] }
# Default features minus `fontconfig`, as for cosmic-text.
fontdb = { version = "0.23.0", default-features = false, features = ["std", "fs", "memmap"] }
# A wrapped line's own direction, for `layout::scene`'s direction mark (ADR-0211).
unicode-bidi = "0.3.18"
unicode-segmentation.workspace = true
# Inflating `.svgz` under a cap of our own, because `usvg::decompress_svgz` reads to the end
# (ADR-0234). Already compiled for `png`, so declaring it adds no crate.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
freedesktop-icons = "0.4.0"
glow = "0.18.0"
# femtovg declares `image` with `default-features = false` and turns no format on, so its own
# `load_image_file` answers every PNG with `Unsupported(Exact(Png))`. `image::decode_raster` calls
# the crate directly instead, and this is where the formats it accepts are named. `webp` because a
# wallpaper folder is full of them (ADR-0122). `gif` for animated sources (ADR-0233).
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# The decoder `image`'s own `gif` feature already compiles; used directly for per-frame rects and
# disposal that `AnimationDecoder` composites away (ADR-0235). Adds no crate.
gif = "0.14.2"
cursor-icon = "1.2.0"
khronos-egl = { version = "6.0.0", features = ["static"] }
# One `mallopt` call at startup (`main.rs`, ADR-0123). Already in the tree through `nix`.
libc.workspace = true
mlua = { version = "0.12.0", features = ["lua54", "vendored", "serde"] }
# "resource" is `getrusage`, read only by the env-gated `wayland::idle_profile` (ADR-0132) to
# split the poll loop's CPU between this thread and the rest of the process.
nix = { workspace = true, features = ["poll", "resource", "time"] }
# `svgz` adds no crate: flate2 is already here through `png`. Not `text`, which would link a second
# fontdb (0.24 against cosmic-text's 0.23) and a second harfrust just for `<text>` (ADR-0234).
resvg = { version = "0.48.1", default-features = false, features = ["svgz"] }
serde_json.workspace = true
shared.workspace = true
# No `calloop`: the event loop is our own poll (`wake.rs`). 154 to 150.
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["xkbcommon"] }
taffy = { version = "0.14.0", default-features = false, features = ["std", "flexbox", "grid", "taffy_tree"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "macros", "sync"] }
wayland-client.workspace = true
wayland-egl = "0.32.11"
wayland-protocols = { workspace = true, features = ["client", "staging"] }
# `zwlr_screencopy_manager_v1`: Hyprland has not shipped `ext-image-copy-capture-v1` (ADR-0248).
wayland-protocols-wlr = { workspace = true, features = ["client"] }
md5 = "0.8"
png.workspace = true
rustc-hash = "2"
# dma-buf capture allocation (ADR-0248 amendment). No default features: `import-wayland` and
# `import-egl` are the reverse direction (a compositor importing a client's dmabuf), and
# `drm-support` only adds KMS scanout traits neither `Device` nor `BufferObject` need here.
# `Format`/`Modifier` are `drm_fourcc` re-exports gbm always carries, so no separate dependency.
gbm = { version = "0.18.0", default-features = false }

[dev-dependencies]
tempfile.workspace = true
# `time` is test-only (`socket/mod.rs` timeouts).
tokio = { workspace = true, features = ["time"] }
