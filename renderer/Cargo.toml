[package]
name = "renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
cosmic-text = "0.19.0"
femtovg = "0.26.0"
fontdb = "0.23.0"
glow = "0.18.0"
khronos-egl = { version = "6.0.0", features = ["static"] }
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }
shared = { version = "0.1.0", path = "../shared" }
smithay-client-toolkit = "0.21.1"
tokio = { version = "1.53.1", features = ["rt", "net", "macros"] }
wayland-client = "0.31.15"
wayland-egl = "0.32.11"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[dev-dependencies]
tempfile = "3.27.0"
ttf-parser = "0.25.1"
