# The docs site. A PR builds the book and checks its links; a push to main also runs the tests
# (the doc examples among them) and deploys to GitHub Pages.
name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A PR's stale run is cancelled; a deploy in flight is not.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Arch, not Ubuntu: the `updates` capability links libalpm.
  test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git rust clang pipewire mesa libxkbcommon wayland fontconfig ttf-dejavu
      - uses: actions/checkout@v4
      - run: cargo test --workspace --locked

  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just,mdbook,lychee
      - run: just book
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: [test, book]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
