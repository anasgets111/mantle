# The docs site. A PR builds the book and checks its links; a push to main also deploys it to GitHub
# Pages. The tests, doc examples included, run in the pre-commit hook, not here.
name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A PR's stale run is cancelled; a deploy in flight is not.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: just,mdbook,lychee
      - run: just book
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: book
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
