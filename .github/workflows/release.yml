# The x86_64 tarball, .deb and .rpm: a `v*` tag builds them and publishes a GitHub release; a
# manual run builds them as a workflow artifact only. It builds in ubuntu:26.04, so glibc 2.43's
# symbol versions set the floor: an older glibc refuses to load the binaries.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    # A container job's steps default to `sh`, which has no `${var::n}`.
    defaults:
      run:
        shell: bash
    steps:
      - name: Build dependencies
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -qy --no-install-recommends \
            ca-certificates curl build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libpam0g-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libegl-dev libgbm-dev
      - name: nfpm
        run: |
          curl -fsSLo /tmp/nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb
          echo "3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97  /tmp/nfpm.deb" | sha256sum -c
          dpkg -i /tmp/nfpm.deb
      - uses: actions/checkout@v7
      # Ubuntu's own rustc trails stable; build with exactly the `rust-version` Cargo.toml declares.
      - name: Rust
        run: |
          curl -fsSLo /tmp/rustup-init https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
          echo "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71  /tmp/rustup-init" | sha256sum -c
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal \
            --default-toolchain "$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # The binaries report Cargo's version and the packages the tag's, so a mismatch ships both.
      - name: Tag matches Cargo version
        if: github.ref_type == 'tag'
        run: |
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          [ "${GITHUB_REF_NAME#v}" = "$cargo_version" ] || { echo "tag $GITHUB_REF_NAME, Cargo $cargo_version: run just tag-release"; exit 1; }
      - run: cargo build --workspace --release --locked
      # The layout `setup.rs` and `renderer_binary_path` resolve: both binaries in
      # `$PREFIX/lib/mantle`, the stubs in `$PREFIX/share/mantle/lua-meta`.
      - name: Package
        id: package
        run: |
          # `~` sorts a manual build before any release in both dpkg and rpm.
          export VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="0~git${GITHUB_SHA::7}"
          name="mantle-$VERSION-x86_64-linux"
          root="stage/$name"
          install -Dm755 -t "$root/usr/local/lib/mantle" target/release/mantle target/release/mantle-renderer
          mkdir -p "$root/usr/local/bin"
          ln -s ../lib/mantle/mantle "$root/usr/local/bin/mantle"
          install -Dm644 -t "$root/usr/local/share/mantle/lua-meta" lua-meta/*.lua
          install -Dm644 LICENSE "$root/usr/local/share/licenses/mantle/LICENSE"
          install -Dm644 packaging/pam.d/mantle "$root/etc/pam.d/mantle"
          install -Dm644 -t "$root/etc/polkit-1/rules.d" packaging/polkit-1/rules.d/*.rules
          # Both binaries load and the renderer evaluates the starter config, with no compositor.
          "$root/usr/local/bin/mantle" check -c share/starter
          if readelf -d "$root"/usr/local/lib/mantle/* | grep -q libalpm; then exit 1; fi
          # Every linked library needs an rpm soname in nfpm.yaml; glibc's own come with libc6.
          for lib in $(readelf -d "$root"/usr/local/lib/mantle/* | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | sort -u); do
            case "$lib" in ld-linux*|libm.so*) continue ;; esac
            grep -qF -- "- $lib" packaging/nfpm.yaml || { echo "$lib is missing from packaging/nfpm.yaml"; exit 1; }
          done
          echo "glibc floor: $(readelf -W --dyn-syms "$root"/usr/local/lib/mantle/* | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          tar -C "$root" -czf "stage/$name.tar.gz" usr etc
          nfpm package -f packaging/nfpm.yaml -p deb -t stage/
          nfpm package -f packaging/nfpm.yaml -p rpm -t stage/
          (cd stage && sha256sum *.tar.gz *.deb *.rpm > SHA256SUMS)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            stage/*.tar.gz
            stage/*.deb
            stage/*.rpm
            stage/SHA256SUMS

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs/changelog.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The notes are the tag's changelog section, its book-relative links made absolute.
      - run: |
          awk -v h="## ${GITHUB_REF_NAME#v} " '/^## /{p = index($0, h) == 1; next} p' docs/changelog.md |
            sed -E 's#\]\(([^):#]+)\.md#](https://anasgets111.github.io/mantle/\1.html#g' >notes.md
          grep -q . notes.md || { echo "docs/changelog.md has no ${GITHUB_REF_NAME#v} section"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md dist/*
        env:
          GH_TOKEN: ${{ github.token }}

  # Publishes mantle-bin: this tag's version and tarball checksum into
  # packaging/aur/mantle-bin/PKGBUILD, pushed with the AUR_SSH_KEY deploy key.
  aur:
    needs: release
    runs-on: ubuntu-26.04
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git openssh
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packaging/aur
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Push to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sum="$(awk '/x86_64-linux\.tar\.gz$/ {print $1}' dist/SHA256SUMS)"
          # ssh finds ~ from passwd (/root), not the container's $HOME, so it gets explicit paths.
          ssh_dir="$(mktemp -d)"
          printf '%s\n' "$AUR_SSH_KEY" >"$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          # The key aur.archlinux.org publishes (SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4).
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' >"$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"
          git clone ssh://aur@aur.archlinux.org/mantle-bin.git aur
          sed -e "s/^pkgver=.*/pkgver=$version/" -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/aur/mantle-bin/PKGBUILD >aur/PKGBUILD
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder aur
          runuser -u builder -- sh -c 'cd aur && makepkg --printsrcinfo >.SRCINFO'
          cd aur
          git config --global --add safe.directory "$PWD"
          git add PKGBUILD .SRCINFO
          # A rerun of the same tag has nothing to commit.
          git diff --cached --quiet ||
            git -c user.name='Anas Khalifa' -c user.email=anasgets111@gmail.com commit -qm "$version"
          git push origin HEAD:master
